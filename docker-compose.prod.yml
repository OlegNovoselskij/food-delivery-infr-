name: atrium

x-app-environment: &app-environment
  APP_ENV: production
  LOG_FORMAT: json
  DATABASE_URL: postgresql+psycopg2://atrium:${POSTGRES_PASSWORD}@db:5432/atrium
  SECRET_KEY: ${SECRET_KEY}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
  ADMIN_COOKIE_SECURE: "true"
  VALKEY_URL: redis://valkey:6379/0
  ALLOWED_ORIGINS: https://${FRONTEND_DOMAIN}
  PUBLIC_API_URL: https://${API_DOMAIN}
  FRONTEND_URL: https://${FRONTEND_DOMAIN}
  S3_ENDPOINT_URL: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  S3_PUBLIC_ENDPOINT_URL: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  S3_ACCESS_KEY: ${R2_ACCESS_KEY_ID}
  S3_SECRET_KEY: ${R2_SECRET_ACCESS_KEY}
  S3_REGION: auto
  S3_BUCKET: ${R2_PRIVATE_BUCKET}
  S3_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET}
  S3_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
  S3_AUTO_SETUP: "false"
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_TEST_PAGE_ENABLED: "false"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    mem_limit: 64m

  frontend:
    image: ${FRONTEND_IMAGE:-atrium-frontend:local}
    build:
      context: ${FRONTEND_CONTEXT:-../frontend}
      args:
        VITE_API_URL: https://${API_DOMAIN}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    environment:
      API_ORIGIN: https://${API_DOMAIN}
      API_WS_ORIGIN: wss://${API_DOMAIN}
      STORAGE_ORIGIN: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    restart: unless-stopped
    mem_limit: 32m

  backend:
    image: ${BACKEND_IMAGE:-atrium-backend:local}
    build:
      context: ${BACKEND_CONTEXT:-../backend}
      target: prod
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 400m

  worker:
    image: ${BACKEND_IMAGE:-atrium-backend:local}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: 200m

  db:
    image: postgres:16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atrium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium -d atrium"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 300m

  valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
